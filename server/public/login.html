<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <style>
    body {
      background: #0d1117;
      color: #e6edf3;
    }

    .login-card {
      background: #161b22;
      border-radius: 14px;
      padding: 25px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
    }

    .form-control {
      background: #0d1117;
      border: 1px solid #30363d;
      color: #e6edf3;
    }

    .form-control:focus {
      border-color: #58a6ff;
      box-shadow: 0 0 6px rgba(88,166,255,0.5);
      background: #0d1117;
      color: white;
    }

    .forgot-link {
      font-size: 13px;
      color: #58a6ff;
      text-decoration: none;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .btn-primary {
      background: linear-gradient(135deg, #238636, #2ea043);
      border: none;
    }
  </style>
</head>

<body>

<div id="header"></div>

<div class="container d-flex justify-content-center align-items-center" style="min-height: 90vh;">

  <div class="login-card">

    <h3 class="text-center mb-4">Login</h3>

    <form onsubmit="login(event)">

      <!-- EMAIL -->
      <div class="mb-3">
        <label>Email</label>
        <input id="email" type="email" class="form-control" placeholder="Enter email" required>
      </div>

      <!-- PASSWORD + FORGOT -->
      <div class="d-flex justify-content-between align-items-center mb-1">
        <label>Password</label>
        <a href="reset.html" class="forgot-link">Forgot?</a>
      </div>

      <div class="mb-3">
        <input id="password" type="password" class="form-control" placeholder="Enter password" required>
      </div>

      <button id="loginBtn" type="submit" class="btn btn-primary w-100">
        Login
      </button>

    </form>

    <p class="text-center mt-3">
      Don’t have an account?
      <a href="signup.html" class="text-info">Signup</a>
    </p>

  </div>

</div>

<script src="js/header.js"></script>
<script src="js/login.js"></script>

</body>
</html>
