```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Password</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-light d-flex justify-content-center align-items-center" style="height:100vh;">

  <div class="card p-4 bg-secondary" style="width: 350px;">
    <h3 class="text-center mb-3">Reset Password</h3>

    <form id="resetForm">
      <div class="mb-3">
        <label>New Password</label>
        <input type="password" id="newPassword" class="form-control" required>
      </div>

      <div class="mb-3">
        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" class="form-control" required>
      </div>

      <button type="submit" class="btn btn-success w-100">Reset Password</button>
    </form>

    <div class="mt-3 text-center">
      <a href="login.html" class="text-light">Back to Login</a>
    </div>
  </div>

  <!-- ✅ SCRIPT -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {

      const email = localStorage.getItem("resetEmail");
      console.log("Stored Email:", email);

      // ❌ If no email → redirect
      if (!email) {
        alert("Session expired. Please try again.");
        window.location.href = "/forgot.html";
        return;
      }

      const form = document.getElementById("resetForm");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const newPassword = document.getElementById("newPassword").value.trim();
        const confirmPassword = document.getElementById("confirmPassword").value.trim();

        // ✅ Validation
        if (newPassword.length < 6) {
          alert("Password must be at least 6 characters");
          return;
        }

        if (newPassword !== confirmPassword) {
          alert("Passwords do not match!");
          return;
        }

        try {
          const res = await fetch("/reset-password", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              email: email,
              password: newPassword
            })
          });

          const data = await res.json();
          alert(data.message);

          if (res.status === 200) {
            // ✅ clear stored email
            localStorage.removeItem("resetEmail");

            // ✅ redirect to login
            window.location.href = "/login.html";
          }

        } catch (err) {
          console.error(err);
          alert("Server error. Try again.");
        }

      });

    });
  </script>

</body>
</html>
```
