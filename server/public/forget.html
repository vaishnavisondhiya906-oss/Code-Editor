```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-light d-flex justify-content-center align-items-center" style="height:100vh;">

  <div class="card p-4 bg-secondary" style="width: 350px;">
    <h3 class="text-center mb-3">Forgot Password</h3>

    <form id="forgotForm">
      <div class="mb-3">
        <label>Email</label>
        <input type="email" id="email" class="form-control" required>
      </div>

      <button type="submit" class="btn btn-warning w-100">Send Reset Link</button>
    </form>

    <div class="mt-3 text-center">
      <a href="login.html" class="text-light">Back to Login</a>
    </div>
  </div>

  <!-- ✅ SCRIPT -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {

      const form = document.getElementById("forgotForm");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = document.getElementById("email").value.trim();

        if (!email) {
          alert("Please enter your email");
          return;
        }

        // ✅ Save email for reset page
        localStorage.setItem("resetEmail", email);
        console.log("Saved Email:", email);

        try {
          const res = await fetch("/forgot-password", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ email })
          });

          const data = await res.json();

          alert(data.message);

          if (res.status === 200) {
            window.location.href = "/reset.html";
          }

        } catch (err) {
          console.error(err);
          alert("Server error. Please try again.");
        }
      });

    });
  </script>

</body>
</html>
```
